<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Novel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto+Serif+KR', serif;
            background-color: #05050a;
        }

        /* 전체 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            transition: background-image 0.8s ease;
        }

        /* 상단 메뉴바 */
        .top-nav {
            position: absolute;
            top: 0;
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            padding-left: 50px;
            color: #d1d1d1;
            font-size: 0.85rem;
            letter-spacing: 1px;
            z-index: 100;
        }

        /* 왼쪽 상단 버튼: 처음으로 돌아가기 */
        #back-btn {
            position: absolute;
            top: 60px;
            left: 30px;
            padding: 8px 15px;
            background: rgba(10, 15, 25, 0.7);
            color: #a0e0d0;
            border: 1px solid #4a6a70;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
            z-index: 100;
            transition: 0.3s;
        }
        #back-btn:hover { background: rgba(160, 224, 208, 0.2); }

        /* 대사창 영역 */
        #dialogue-area {
            position: relative;
            width: 80%;
            max-width: 1100px;
            min-height: 180px;
            margin-bottom: 60px;
            /* 그라데이션 */
            background: linear-gradient(to bottom, rgba(28, 26, 46, 0.9), rgba(15, 14, 26, 0.95));
            border-top: 1px solid #d4af37;
            border-bottom: 1px solid #d4af37;
            padding: 40px 60px;
            box-sizing: border-box;
            z-index: 10;
            text-align: center; /* 가운데 정렬 */
        }

        /* 대사창 장식선 */
        #dialogue-area::before, #dialogue-area::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 1px;
            background: #d4af37;
            left: 50%;
            transform: translateX(-50%);
        }
        #dialogue-area::before { top: 10px; }
        #dialogue-area::after { bottom: 10px; }

        /* 이름표 */
        #character-name {
            position: absolute;
            top: -35px;
            right: 50px;
            color: #f1f1f1;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            letter-spacing: 2px;
            border-bottom: 2px solid #d4af37;
            padding: 0 10px 5px 10px;
        }

        /* 대사 텍스트 */
        #dialogue-text {
            font-size: 1.4rem;
            line-height: 1.8;
            color: #ffffff;
            white-space: pre-wrap;
            word-break: keep-all;
        }

        /* 선택지 영역 */
        #hover-trigger {
            position: absolute;
            right: 0;
            top: 0;
            width: 400px;
            height: 100%;
            z-index: 15;
        }

        #selection-container {
            position: absolute;
            right: 10%;
            top: 30%;
            width: 320px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            z-index: 20;
            pointer-events: none;
        }

        #hover-trigger:hover + #selection-container,
        #selection-container:hover {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .selection-box {
            background: rgba(15, 14, 26, 0.9);
            border: 1px solid #d4af37;
            padding: 20px;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .choice-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 15px;
            margin-bottom: 10px;
            color: #eee;
            cursor: pointer;
            text-align: center;
            font-size: 1rem;
            transition: all 0.3s;
            position: relative;
            font-family: 'Noto+Serif+KR', serif;
        }

        .choice-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* 하단 장식 */
        .deco {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #1c1a2e;
            border: 1px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 0.8rem;
        }

    </style>
</head>
<body>

<div id="game-container">
    <div class="top-nav">데드라인：까불면 죽는다</div>
    
    <button id="back-btn" onclick="goToScene(1)">◀ 처음으로 돌아가기</button>

    <div id="hover-trigger"></div>
    <div id="selection-container">
        <div class="selection-box" id="choice-list">
            </div>
    </div>

    <div id="dialogue-area">
        <div id="character-name">이반 템페스트</div>
        <div id="dialogue-text"></div>
        <div class="deco">🚬</div>
    </div>
</div>

<script>
    const sceneData = {
        1: {
            bg: "1.png",
            text: "[이반이 당신을 빤히 바라보더니 나직하게 말한다.]\n\"팀장님 말고, 이름으로 불러.\"",
            choices: [
                { text: "이반 팀장님.", next: 2 },
                { text: "네 이반오빠!!", next: 3 }
            ],
            showBack: false
        },
        2: {
            bg: "2.png",
            text: "[그의 미간이 살짝 찌푸려진다.]\n\"...일부러인가?\"",
            choices: [],
            showBack: true
        },
        3: {
            bg: "3.png",
            text: "\"오빠? 난 네 오빠가 아니다 쓰레기1.\"\n[그는 차갑게 쏘아붙였지만, 입가엔 미미한 미소가 걸려 있다.]\n\"뭐 그래도... 아까보단 훨씬 낫군.\"",
            choices: [],
            showBack: true
        }
    };

    function goToScene(sceneId) {
        const scene = sceneData[sceneId];
        const container = document.getElementById('game-container');
        const textElement = document.getElementById('dialogue-text');
        const choiceList = document.getElementById('choice-list');
        const backBtn = document.getElementById('back-btn');
        const selectionContainer = document.getElementById('selection-container');

        container.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.3)), url('${scene.bg}')`;
        
        textElement.innerText = "";
        let i = 0;
        function typeWriter() {
            if (i < scene.text.length) {
                textElement.innerText += scene.text.charAt(i);
                i++;
                setTimeout(typeWriter, 35);
            }
        }
        typeWriter();

        choiceList.innerHTML = "<div style='color:#d4af37; font-size:0.8rem; margin-bottom:15px; text-align:center;'>Choice</div>";
        if (scene.choices.length > 0) {
            scene.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => goToScene(choice.next);
                choiceList.appendChild(btn);
            });
        }

        backBtn.style.display = scene.showBack ? "block" : "none";
    }

    window.onload = () => goToScene(1);
</script>

</body>
</html>
